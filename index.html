<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#m{height:100%;margin:0}
#p{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;padding:8px 10px;border-radius:8px;font:13px system-ui,sans-serif;box-shadow:0 1px 6px #0006;width:280px;max-height:calc(100% - 40px);overflow:auto}
#p.ferme #corps{display:none}
#tete{display:flex;align-items:center;justify-content:space-between;gap:6px}#tete b{font-size:14px}
#p button{font:12px system-ui,sans-serif;cursor:pointer;border:1px solid #bbb;background:#f6f6f6;border-radius:4px;padding:2px 6px}
#p button:hover{background:#e8e8e8}#p button.on{background:#2a6;color:#fff;border-color:#2a6}
.sec{border-top:1px solid #ddd;margin-top:7px;padding-top:6px}
.sec h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;color:#666;letter-spacing:.04em}
.fonds{display:grid;grid-template-columns:1fr 1fr;gap:1px 6px}.fonds label{margin:1px 0}
.depbar{display:flex;gap:4px;margin:3px 0 4px 14px}.depbar button{font-size:11px;padding:1px 6px;border:1px solid #ccc;background:#f6f6f6;border-radius:4px;cursor:pointer}.depbar button:hover{background:#e8e8e8}
.sec h5{margin:7px 0 2px;font-size:10.5px;font-weight:600;color:#888}
.opf{font-size:12px;color:#666;display:flex;align-items:center;gap:6px;margin:2px 0 2px}
.cou{margin:1px 0}.cou label{display:block}
input.op{width:100%;max-width:200px;height:14px;margin:0 0 3px 20px;display:block}.opf input.op{margin:0;flex:1}
.cou input.op,.cou .leg{display:none}.cou.on input.op,.cou.on .leg{display:block}
details.dep{margin:2px 0;border-radius:5px}
details.dep>summary{cursor:pointer;padding:3px 4px;font-weight:600;background:#f3f3f3;border-radius:5px;list-style:none;display:flex;justify-content:space-between}
details.dep>summary::-webkit-details-marker{display:none}
details.dep>summary:before{content:'▸ ';color:#888}details.dep[open]>summary:before{content:'▾ '}
.plan{display:grid;grid-template-columns:18px 1fr auto auto;align-items:center;gap:4px;margin:3px 0 3px 6px}
.plan .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.plan .nom:hover{text-decoration:underline}
.plan input[type=range]{grid-column:2/5;width:100%;height:14px;margin:0;display:none}.plan.actif input[type=range]{display:block}
.badge{font-size:11px;cursor:help}
#filtre{width:100%;box-sizing:border-box;font:12px system-ui;padding:3px 5px;border:1px solid #bbb;border-radius:4px;margin-bottom:4px}
#rech{display:flex;gap:4px}#rech input{flex:1;min-width:0;font:12px system-ui;padding:3px 5px;border:1px solid #bbb;border-radius:4px}
#res div{padding:6px 4px;cursor:pointer;border-radius:3px;font-size:12px}#res div:hover{background:#eef}
.outils{display:flex;flex-wrap:wrap;gap:4px}
#info{font-size:12px;color:#333;margin-top:4px;min-height:16px}
#rideau{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 4px #000a;z-index:900;cursor:ew-resize;display:none}
#rideau span{position:absolute;top:50%;left:-13px;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:#fff;box-shadow:0 0 4px #000a;text-align:center;line-height:30px;font:bold 14px system-ui;user-select:none}
.leaflet-container.mesure{cursor:crosshair}
.cp{font:12px system-ui}.cp button{font:11px system-ui;margin-top:4px}
.contour-lbl{background:#fffd;border:1px solid #c60;color:#630;font:600 11px system-ui;padding:1px 4px;border-radius:3px;box-shadow:none}
#lock{position:fixed;inset:0;z-index:5000;background:#1d2228;display:flex;align-items:center;justify-content:center;font:14px system-ui,sans-serif}
#lock form{background:#fff;padding:22px 24px;border-radius:10px;width:300px;max-width:88vw;box-shadow:0 4px 20px #0008}
#lock h2{margin:0 0 6px;font-size:18px}#lock p{margin:0 0 12px;color:#555;font-size:13px}
#lock input[type=password]{width:100%;box-sizing:border-box;font:16px monospace;padding:8px;border:1px solid #aaa;border-radius:6px;letter-spacing:.05em}
#lock button{margin-top:10px;width:100%;padding:8px;font:600 14px system-ui;background:#2a6;color:#fff;border:0;border-radius:6px;cursor:pointer}
#lock .err{color:#c00;min-height:18px;font-size:13px;margin-top:6px}
#rlt{margin:5px 0 3px;padding:6px;background:#f4f7f5;border-radius:6px}.tl-lab{font-size:11px;color:#666;margin-bottom:4px}
#chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
#chips button{flex:0 0 auto;border-radius:12px!important;padding:2px 9px!important;white-space:nowrap}
#chips button.on{background:#2a6;color:#fff;border-color:#2a6}#epqc{margin-top:5px;width:100%}
#fiche{position:absolute;z-index:1500;right:10px;top:10px;max-height:calc(100% - 20px);width:min(520px,calc(100% - 20px));display:none;flex-direction:column;overflow:hidden;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.45));-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.9)}
#fh{display:flex;align-items:center;gap:8px;padding:10px 14px;font:14px system-ui}#fh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#fh a{font-size:13px;color:#1a5fb4;text-decoration:none}#fh button{border:0;background:rgba(255,255,255,.6);border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer}
#fi{flex:1;overflow:auto;padding:4px 14px 14px;font:14px system-ui}#fi table{width:100%;border-collapse:collapse}#fi td{padding:5px 4px;border-bottom:1px solid rgba(0,0,0,.08);vertical-align:top}#fi td:first-child{color:#555;width:42%}#fi .big{display:block;margin:12px 0 4px;padding:10px;text-align:center;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:#1a5fb4;text-decoration:none;font-weight:600}
#fi .sous{color:#444;font-size:13px;margin:2px 0 8px}#fi .nb{font-size:12px;color:#666;margin-bottom:6px}#fi .doc{display:flex;gap:10px;align-items:center;padding:8px;margin:0 0 8px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);text-decoration:none;color:#222}#fi .doc img{width:120px;height:90px;object-fit:contain;background:#fff;border-radius:8px;flex:0 0 auto}#fi .noimg{width:120px;height:90px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#fff;border-radius:8px}#fi .dt{display:flex;flex-direction:column;gap:3px;min-width:0}#fi .dt small{color:#666;word-break:break-all}
.anStar{font-size:24px;line-height:24px;text-align:center;color:#f5b400;text-shadow:0 0 2px #000,0 0 4px #000a}
#anList .an{display:flex;align-items:center;gap:6px;padding:3px 0}#anList .an span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}#anList .an button{padding:0 6px}
.anPop textarea{width:230px;height:90px;font:13px system-ui;box-sizing:border-box}.anPop .txt{white-space:pre-wrap;max-width:240px;font:13px system-ui;margin-bottom:6px}.anPop button{margin-right:4px}
/* Liquid Glass */
#p{background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.32));-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.65);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.25)}
#p button,.depbar button{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
#p button:hover{background:rgba(255,255,255,.7)}
details.dep>summary,#rlt{background:rgba(255,255,255,.38)!important}
.sec{border-top:1px solid rgba(255,255,255,.55)}
#filtre,#rech input,#epq{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75)}
#bulle{position:absolute;z-index:1001;left:50%;transform:translateX(-50%);top:10px;background:#fff;border-radius:16px;padding:6px 12px;font:600 14px system-ui;box-shadow:0 1px 6px #0006;display:none;max-width:80vw;text-align:center}
@media (max-width:640px){
#p{top:auto;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));width:auto;max-height:62vh;font-size:15px;padding:8px 12px;border-radius:14px 14px 10px 10px;box-shadow:0 -2px 12px #0005}
#tete{min-height:36px;position:sticky;top:-8px;background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:2;margin:-8px -12px 0;padding:8px 12px}#tete b{font-size:16px}#pli{font-size:20px!important;padding:4px 14px!important}
#p button{font-size:14px;padding:6px 10px;border-radius:6px}
.depbar button{font-size:13px;padding:5px 9px}
#p input[type=checkbox],#p input[type=radio]{width:20px;height:20px;vertical-align:-4px;margin:2px 6px 2px 0}
.fonds{gap:4px 8px}.fonds label,.cou label{padding:4px 0}
input.op,.plan input[type=range]{height:26px;max-width:none}
.plan{grid-template-columns:26px 1fr auto auto;gap:6px;margin:6px 0 6px 2px}
details.dep>summary{padding:9px 8px;font-size:15px}
#filtre,#rech input{font-size:16px;padding:7px 8px}
.sec h4{font-size:12px}.sec h5{font-size:12px}
.outils button{flex:1 1 45%}
#info{font-size:14px}
#rideau{width:6px;margin-left:-3px}#rideau span{width:48px;height:48px;left:-21px;margin-top:-24px;line-height:48px;font-size:20px}
.leaflet-bottom.leaflet-right{display:none}
.leaflet-control-zoom{display:none}
#p.ferme{left:auto;right:14px;width:auto;padding:0;background:transparent;box-shadow:none;border-radius:50%;opacity:.7;overflow:visible}
#p.ferme #tete{margin:0;padding:0;background:transparent;position:static;min-height:0}#p.ferme #tete b{display:none}
#p.ferme{-webkit-backdrop-filter:none;backdrop-filter:none;border:0}#p.ferme #pli{width:56px;height:56px;border-radius:50%!important;padding:0!important;font-size:26px!important;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.4));-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);border:1px solid rgba(255,255,255,.8);box-shadow:0 4px 16px rgba(0,0,0,.3),inset 0 1px 0 #fff}
#fiche{left:6px;right:6px;top:auto;bottom:6px;width:auto;max-height:70%}
}
</style></head><body>
<div id="lock"><form id="lockf"><h2>🔒 Atlas</h2><p>Accès réservé. Entre le code d'accès.</p>
<input id="code" type="password" autocomplete="current-password" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" autofocus>
<label style="display:block;margin-top:8px;font-size:13px"><input id="memo" type="checkbox"> Se souvenir sur cet appareil</label>
<button type="submit">Déverrouiller</button><div class="err" id="lerr"></div></form></div>
<div id="m"></div><div id="fiche"><div id="fh"><b id="ft">Fiche BRGM</b><a id="fo" target="_blank" rel="noopener">↗ Onglet</a><button id="fx">✕</button></div><div id="fi"></div></div><div id="bulle"></div><div id="rideau"><span>⇔</span></div>
<div id="p">
 <div id="tete"><b>Atlas</b><button id="pli" title="Replier / déplier le menu">☰</button></div>
 <div id="corps">
  <div class="sec"><h4>Rechercher un lieu</h4>
   <div id="rech"><input id="q" placeholder="Adresse, lieu, commune…"><button id="go">🔍</button></div><div id="res"></div></div>
  <div class="sec"><h4>Fond de carte</h4><div class="fonds">
   <label><input type="radio" name="b" value="o" checked> Satellite</label>
   <label><input type="radio" name="b" value="t"> Carte IGN</label>
   <label><input type="radio" name="b" value="p"> OSM</label>
   <label><input type="radio" name="b" value="l"> Relief LiDAR</label>
      <label><input type="radio" name="b" value="w"> Fond blanc</label></div>
   <div id="rlt"><div class="tl-lab">🕰️ Remonter le temps</div><div id="chips"></div><button id="epqc" style="display:none">⇔ Comparer avec aujourd'hui</button></div>
   <div class="opf">Opacité <input id="fondo" class="op" type="range" min="0.1" max="1" step="0.05" value="1" title="Opacité du fond"></div>
   <h5 style="display:flex;align-items:center;justify-content:space-between">Annotations <span><button id="anAdd" title="Ajouter un point (puis touche la carte)" style="font-size:15px;line-height:1;padding:1px 8px">＋</button></span></h5>
   <div id="anList" style="font-size:12.5px"></div>
   <div id="anTools" style="display:none;font-size:11px;margin:2px 0 4px"><a href="#" id="anExp">⇩ Exporter</a> · <a href="#" id="anImp">⇧ Importer</a><input type="file" id="anFile" accept=".json" style="display:none"></div>
   <h5>Cadastre et limites</h5>
   <div class="cou"><label><input id="cad" type="checkbox"> Cadastre (parcelles IGN)</label><input id="cado" class="op" type="range" min="0.1" max="1" step="0.05" value="1" title="Opacité"></div>
   <div class="cou"><label><input id="cad2" type="checkbox"> Cadastre 2008-2013 (scans)</label><input id="cad2o" class="op" type="range" min="0.1" max="1" step="0.05" value="1" title="Opacité"></div>
   <div class="cou"><label><input id="adm" type="checkbox"> Limites de communes</label><input id="admo" class="op" type="range" min="0.1" max="1" step="0.05" value="1" title="Opacité"></div>
   <h5>Carrières</h5>
   <div class="cou"><label><input id="igcp" type="checkbox"> Atlas IGC Paris (en direct)</label><input id="igcpo" class="op" type="range" min="0.1" max="1" step="0.05" value="0.9" title="Opacité"></div>
   <div class="cou"><label><input id="gir" type="checkbox"> Carrières de Gironde (en direct)</label><input id="giro" class="op" type="range" min="0.1" max="1" step="0.05" value="1" title="Opacité"></div>
   <div class="cou"><label><input id="zon" type="checkbox"> Zonages carrières IGC (78/95/91)</label><input id="zono" class="op" type="range" min="0.1" max="1" step="0.05" value="1" title="Opacité"></div>
   <div class="cou"><label><input id="eur" type="checkbox"> Cavités de l'Eure (indices DDTM 27)</label><input id="euro" class="op" type="range" min="0.1" max="1" step="0.05" value="1" title="Opacité"><style>#eursub label{padding:2px 0!important}</style><div class="leg" id="eursub" style="font-size:12.5px;margin:2px 0 4px 22px;line-height:1.3">
<label><input type="checkbox" data-c="l" checked> 🔴 Rayons de forme particulière <small>(44)</small></label>
<label><input type="checkbox" data-c="p" checked> 🩷 Emprises de cavités relevées <small>(1 428)</small></label>
<label><input type="checkbox" data-c="c"> 🟣 Indices sans forme connue <small>(3 404)</small></label>
<label><input type="checkbox" data-c="x"> 🟠 Rayons découpés <small>(275)</small></label>
<label><input type="checkbox" data-c="r"> 🔵 Rayons de sécurité ronds <small>(6 643)</small></label></div></div>
   <h5>Divers</h5>
   <div class="cou"><label><input id="bss" type="checkbox"> Points BRGM « Dossiers du sous-sol »</label></div>
   <div class="cou"><label><input id="aqu" type="checkbox"> Aqueducs et rigoles de Versailles</label><input id="aquo" class="op" type="range" min="0.1" max="1" step="0.05" value="1" title="Opacité"></div>
   <div class="cou"><label><input id="cont" type="checkbox" checked> Contours des plans</label></div></div>
  <div class="sec"><h4>Plans <span id="nbp" style="text-transform:none;color:#999"></span></h4>
   <input id="filtre" placeholder="Filtrer les plans…"><div id="plans">Chargement…</div>
   <button id="tout0" title="Décharger tous les plans">Tout décharger</button></div>
  <div class="sec"><h4>Outils</h4><div class="outils">
   <button id="bPos">📍 Ma position</button>
   <button id="bMes" title="Clique pour poser des points, double-clic ou Échap pour finir">📏 Mesurer</button>
   <button id="bRid" title="Comparer le plan et le fond avec une barre à glisser">⇔ Rideau</button>
   <button id="bLien" title="Copier un lien vers la vue actuelle">🔗 Lien</button>
   <button id="bLock" title="Oublier le code sur cet appareil">🔒 Verrouiller</button></div>
   <div id="info"></div></div>
 </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const g=(l,s,f)=>`https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${l}&STYLE=${s}&FORMAT=${f}&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const store={get(k,d){try{const v=localStorage.getItem('map2_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('map2_'+k,JSON.stringify(v))}catch(e){}}};
const map=L.map('m',{zoomControl:true,maxZoom:22,zoomSnap:0.5,wheelPxPerZoomLevel:90});
map.createPane('plans').style.zIndex=250;map.createPane('cadp').style.zIndex=300;map.createPane('cont').style.zIndex=350;
const fondOpt={maxZoom:22,maxNativeZoom:18,keepBuffer:1,updateWhenZooming:false};
const B={o:L.tileLayer(g('ORTHOIMAGERY.ORTHOPHOTOS','normal','image/jpeg'),{...fondOpt,maxNativeZoom:19,attribution:'IGN'}),
t:L.tileLayer(g('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','normal','image/png'),{...fondOpt,maxNativeZoom:19,attribution:'IGN'}),
l:L.tileLayer(g('IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW','normal','image/png'),{...fondOpt,attribution:'IGN'}),
p:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{...fondOpt,maxNativeZoom:19,attribution:'© OpenStreetMap'}),
w:L.tileLayer('data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==',{maxZoom:22})};
let fond=store.get('fond','o');if(!B[fond])fond='o';B[fond].addTo(map);
document.querySelectorAll('[name=b]').forEach(r=>{r.checked=r.value===fond;r.onchange=()=>{Object.values(B).forEach(x=>map.removeLayer(x));B[r.value].addTo(map);store.set('fond',r.value)}});

const cd=L.tileLayer(g('CADASTRALPARCELS.PARCELS','bdparcellaire_o','image/png'),{maxZoom:22,maxNativeZoom:19,pane:'cadp',keepBuffer:1});
const cadCb=document.getElementById('cad');cadCb.checked=store.get('cad',false);if(cadCb.checked)cd.addTo(map);
cadCb.onchange=e=>{e.target.checked?cd.addTo(map):map.removeLayer(cd);store.set('cad',e.target.checked)};
const IGCP=L.TileLayer.extend({getTileUrl(c){const C=2*Math.PI*6378137,t=C/2**c.z;
 const b=[c.x*t-C/2,C/2-(c.y+1)*t,(c.x+1)*t-C/2,C/2-c.y*t].map(v=>v.toFixed(2)).join(',');
 return 'https://capgeo2.paris.fr/public/rest/services/IGC/IGC_Atlas_v2/MapServer/export?bbox='+b+'&bboxSR=3857&imageSR=3857&size=256,256&format=png32&transparent=true&f=image'}});
const igcp=new IGCP('',{maxZoom:22,maxNativeZoom:20,minZoom:12,pane:'plans',opacity:.9,keepBuffer:1,bounds:[[48.76,2.18],[48.99,2.62]],attribution:'Atlas IGC © Ville de Paris'});
const igcpCb=document.getElementById('igcp');igcpCb.checked=store.get('igcp',false);if(igcpCb.checked)igcp.addTo(map);
const igcpO=document.getElementById('igcpo');igcpO.value=store.get('igcpo',0.9);igcp.setOpacity(+igcpO.value);
igcpO.oninput=e=>{igcp.setOpacity(+e.target.value);store.set('igcpo',+e.target.value)};
igcpCb.onchange=e=>{e.target.checked?igcp.addTo(map):map.removeLayer(igcp);store.set('igcp',e.target.checked)};
const ExpL=L.TileLayer.extend({getTileUrl(c){const C=2*Math.PI*6378137,t=C/2**c.z;
 const b=[c.x*t-C/2,C/2-(c.y+1)*t,(c.x+1)*t-C/2,C/2-c.y*t].map(v=>v.toFixed(2)).join(',');
 return this.options.svc+'/export?bbox='+b+'&bboxSR=3857&imageSR=3857&size=256,256&format=png32&transparent=true&f=image'+(this.options.lyr?'&layers=show:'+this.options.lyr:'')}});
const girL=new ExpL('',{svc:'https://sig.gironde.fr/arcgis/rest/services/bcs_carsou_visu/MapServer',lyr:'0,1,2,14,15',maxZoom:22,maxNativeZoom:20,minZoom:9,pane:'plans',keepBuffer:1,bounds:[[44.15,-1.30],[45.60,0.35]],attribution:'Carrières © Département de la Gironde'});
const girCb=document.getElementById('gir');girCb.checked=store.get('gir',false);if(girCb.checked)girL.addTo(map);
const girO=document.getElementById('giro');girO.value=store.get('giro',1);girL.setOpacity(+girO.value);

 const kek=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(L_.salt),iterations:L_.iter},pk,{name:'AES-GCM',length:256},false,['decrypt']);

map.on('locationfound',e=>{if(posM)map.removeLayer(posM);posM=L.layerGroup([L.circle(e.latlng,{radius:e.accuracy,weight:1,color:'#16f',fillOpacity:.1}),L.circleMarker(e.latlng,{radius:6,color:'#fff',weight:2,fillColor:'#16f',fillOpacity:1})]).addTo(map);info.textContent=`Position à ±${Math.round(e.accuracy)} m`});
map.on('locationerror',()=>info.textContent='Position indisponible (autorise la localisation)');
// ---------- mesure ----------
const bMes=document.getElementById('bMes');let couches=[];
function finMesure(){bMes.textContent='📏 Mesurer';if(!mesure)return;map.getContainer().classList.remove('mesure');map.doubleClickZoom.enable();bMes.classList.remove('on');mesure=null}
const dist=pts=>{let s=0;for(let i=1;i<pts.length;i++)s+=pts[i-1].distanceTo(pts[i]);return s};
const fmt=m=>m<1000?m.toFixed(1)+' m':(m/1000).toFixed(2)+' km';
bMes.onclick=()=>{if(mesure){if(mesure.pts.length>1)info.textContent='Distance totale : '+fmt(dist(mesure.pts));finMesure();bMes.textContent='📏 Mesurer';return}couches.forEach(c=>map.removeLayer(c));couches=[];
 mesure={pts:[],ligne:L.polyline([],{color:'#e30',weight:3,dashArray:'6 4'}).addTo(map)};couches.push(mesure.ligne);
 map.getContainer().classList.add('mesure');map.doubleClickZoom.disable();bMes.classList.add('on');info.textContent=mobile()?'Touche la carte pour poser des points. Re-touche 📏 pour finir.':'Clique pour poser des points, double-clic ou Échap pour finir.';if(mobile()){bMes.textContent='✔ Terminer';plier()}};
map.on('click',e=>{if(!mesure)return;mesure.pts.push(e.latlng);mesure.ligne.setLatLngs(mesure.pts);couches.push(L.circleMarker(e.latlng,{radius:4,color:'#e30',fillOpacity:1}).addTo(map));info.textContent='Distance : '+fmt(dist(mesure.pts))});
map.on('dblclick',()=>{if(mesure){info.textContent='Distance totale : '+fmt(dist(mesure.pts))+' (re-clique 📏 pour effacer)';finMesure()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mesure){info.textContent='Distance totale : '+fmt(dist(mesure.pts));finMesure()}});


// ---------- Points BRGM (Banque du sous-sol) ----------
const BRGM='https://geoservices.brgm.fr/geologie';let bssLay='BSS',bssL=null;
const bssCb=document.getElementById('bss');bssCb.checked=store.get('bss',false);
(async()=>{try{const t=await fetch(BRGM+'?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0').then(r=>r.text());const x=new DOMParser().parseFromString(t,'text/xml');
 const L2=[...x.getElementsByTagName('Layer')].map(l=>[l.getElementsByTagName('Name')[0]?.textContent||'',l.getElementsByTagName('Title')[0]?.textContent||'']).filter(a=>a[0]);
 const b=L2.find(a=>a[0]==='BSS')||L2.find(a=>/^BSS/i.test(a[0]))||L2.find(a=>/sous-sol|BSS/i.test(a[1]));if(b){bssLay=b[0];if(bssL){map.removeLayer(bssL);bssOn()}}}catch(e){}})();
function bssOn(){bssL=L.tileLayer.wms(BRGM,{layers:bssLay,format:'image/png',transparent:true,version:'1.3.0',pane:'cont',minZoom:13,maxZoom:22,attribution:'BSS © BRGM'}).addTo(map)}
bssCb.onchange=e=>{store.set('bss',e.target.checked);if(e.target.checked)bssOn();else if(bssL){map.removeLayer(bssL);bssL=null}};if(bssCb.checked)bssOn();
const fiche=document.getElementById('fiche'),fi=document.getElementById('fi'),ft=document.getElementById('ft'),fo=document.getElementById('fo');
document.getElementById('fx').onclick=()=>{fiche.style.display='none'};
L.DomEvent.disableClickPropagation(fiche);L.DomEvent.disableScrollPropagation(fiche);
const ficheUrl=id=>'http://ficheinfoterre.brgm.fr/InfoterreFiche/ficheBss.action?id='+encodeURIComponent(id);
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RELAIS='https://brgm1.robinmorgue.workers.dev/?u=',viaR=u=>RELAIS+encodeURIComponent(u);
async function docsBss(id){const base=ficheUrl(id),vus=new Set(),docs=[],pages=[base];
 for(let n=0;n<pages.length&&n<5;n++){const pu=pages[n];if(vus.has(pu))continue;vus.add(pu);
  let html;try{const r=await fetch(viaR(pu));if(!r.ok)continue;html=await r.text()}catch(e){continue}
  const d=new DOMParser().parseFromString(html,'text/html');const abs=h=>{try{return new URL(h,pu).href}catch(e){return null}};
  d.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');if(/document|numeris/i.test(a.textContent+h)&&!/^javascript|^#/.test(h)){const u=abs(h);if(u&&/brgm\.fr/.test(u)&&!vus.has(u))pages.push(u)}});
  d.querySelectorAll('tr').forEach(tr=>{const a=[...tr.querySelectorAll('a[href]')].find(a=>/\.(tif|tiff|pdf|jpe?g|png)\b/i.test(a.textContent+a.getAttribute('href')))||(tr.querySelector('img')&&tr.querySelector('a[href]'));if(!a)return;
   const u=abs(a.getAttribute('href'));if(!u||docs.some(x=>x.u===u))return;const im=tr.querySelector('img');const tds=[...tr.querySelectorAll('td')].map(t=>t.textContent.trim()).filter(Boolean);
   docs.push({u,nom:a.textContent.trim()||u.split('/').pop(),img:im?abs(im.getAttribute('src')):null,type:tds.find(t=>/[A-Z]{3,}/.test(t)&&!/\.(tif|pdf)/i.test(t)&&!/Ko|Mo/.test(t))||'',poids:tds.find(t=>/\d\s*(Ko|Mo|Go)/i.test(t))||''})})}
 return docs}
async function ouvreFiche(id,attrs){ft.textContent=id;fo.href=ficheUrl(id);
 const g=k=>(attrs.find(([a])=>new RegExp(k,'i').test(a))||[])[1];const sous=[g('nature'),g('prof')&&('prof. '+g('prof')+' m'),g('commune')].filter(Boolean).join(' · ');
 fi.innerHTML=`<div class="sous">${esc(sous||'')}</div><div class="docs">Recherche des documents numérisés…</div>`;fiche.style.display='flex';setTimeout(()=>map.closePopup(),0);pan.classList.contains('ferme')||plier();
 const docs=await docsBss(id);if(ft.textContent!==id)return;const box=fi.querySelector('.docs');
 if(!docs.length){box.innerHTML=`Aucun document numérisé trouvé.<a class="big" href="${ficheUrl(id)}" target="_blank" rel="noopener">📄 Ouvrir la fiche complète</a>`;return}
 box.innerHTML=`<div class="nb">${docs.length} document(s) numérisé(s)</div>`+docs.map(d=>`<a class="doc" href="${viaR(d.u)}" target="_blank" rel="noopener">${d.img?`<img loading="lazy" src="${viaR(d.img)}" alt="">`:'<span class="noimg">📄</span>'}<span class="dt"><b>${esc(d.type||d.nom)}</b><small>${esc(d.nom)}${d.poids?' · '+esc(d.poids):''}</small></span></a>`).join('');}

map.on('click',async e=>{if(anMode||e.anFait||!bssL||(typeof mesure!=='undefined'&&mesure))return;const z=map.getZoom();if(z<13)return;
 const p=map.latLngToContainerPoint(e.latlng),r=12,sw=map.containerPointToLatLng([p.x-r,p.y+r]),ne=map.containerPointToLatLng([p.x+r,p.y-r]);
 const A=L.CRS.EPSG3857.project(sw),Bp=L.CRS.EPSG3857.project(ne);
 const u=BRGM+`?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetFeatureInfo&LAYERS=${bssLay}&QUERY_LAYERS=${bssLay}&CRS=EPSG:3857&BBOX=${A.x},${A.y},${Bp.x},${Bp.y}&WIDTH=25&HEIGHT=25&I=12&J=12&INFO_FORMAT=text/plain&FEATURE_COUNT=5`;
 try{const t=await fetch(u).then(r=>r.text());const m=t.match(/BSS\d{3}[A-Z0-9]{4}/)||t.match(/\d{5}X\d{4}(\/[A-Z0-9_-]+)?/);
  if(m){const attrs=[...t.matchAll(/^\s*([\w.]+)\s*=\s*'?(.*?)'?\s*$/gm)].map(a=>[a[1],a[2]]);ouvreFiche(m[0].startsWith('BSS')?m[0]:m[0],attrs)}}catch(err){info.textContent='Point BRGM : fiche non joignable depuis l\'atlas.'}});

// ---------- Annotations (points étoile, stockés sur l'appareil) ----------
let ANN=store.get('ann',[]);const anLay=L.layerGroup().addTo(map),anMk={};let anMode=false;
const anIcon=L.divIcon({className:'anStar',html:'★',iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-10]});
const anEsc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const anSave=()=>{store.set('ann',ANN);anListe()};
function anVue(a){return `<div class="anPop"><div class="txt">${anEsc(a.t)||'<i style="color:#888">(sans texte)</i>'}</div><div style="font-size:11px;color:#888;margin-bottom:6px">${a.lat.toFixed(6)}, ${a.lng.toFixed(6)}${a.d?' · modifié le '+new Date(a.d).toLocaleDateString('fr-FR'):''}</div><button onclick="anEdit('${a.id}')">✏️ Éditer</button><button onclick="anSuppr('${a.id}')">🗑</button></div>`}
function anEditHtml(a){return `<div class="anPop"><textarea id="anTx">${anEsc(a.t)}</textarea><br><button onclick="anOk('${a.id}')">✔ Enregistrer</button><button onclick="anAnnule('${a.id}')">Annuler</button></div>`}
function anPose(a){const m=L.marker([a.lat,a.lng],{icon:anIcon,draggable:true,zIndexOffset:1000}).bindPopup(anVue(a),{minWidth:240}).bindTooltip(()=>anEsc((a.t||'Point').split('\n')[0]),{direction:'top',offset:[0,-10]});
 m.on('dragend',()=>{const p=m.getLatLng();a.lat=p.lat;a.lng=p.lng;a.d=Date.now();anSave();m.setPopupContent(anVue(a))});anLay.addLayer(m);anMk[a.id]=m}
window.anEdit=id=>{const a=ANN.find(x=>x.id===id);anMk[id].setPopupContent(anEditHtml(a)).openPopup();setTimeout(()=>{const t=document.getElementById('anTx');t&&t.focus()},50)};
window.anOk=id=>{const a=ANN.find(x=>x.id===id);a.t=document.getElementById('anTx').value.trim();a.d=Date.now();anSave();anMk[id].setPopupContent(anVue(a)).openPopup()};
window.anAnnule=id=>{const a=ANN.find(x=>x.id===id);anMk[id].setPopupContent(anVue(a)).openPopup()};
window.anSuppr=id=>{const a=ANN.find(x=>x.id===id);if(a.t&&!window.confirm('Supprimer ce point ?'))return;ANN=ANN.filter(x=>x.id!==id);anLay.removeLayer(anMk[id]);delete anMk[id];anSave()};
function anListe(){const el=document.getElementById('anList');document.getElementById('anTools').style.display='block';
 el.innerHTML=ANN.length?'':'<div style="color:#888;font-size:11.5px">Aucun point. Touche ＋ puis la carte.</div>';
 ANN.forEach(a=>{const d=document.createElement('div');d.className='an';d.innerHTML=`<b style="color:#f5b400">★</b><span title="Aller sur ce point">${anEsc((a.t||'Point sans texte').split('\n')[0])}</span><button title="Éditer">✏️</button>`;
  d.children[1].onclick=()=>{map.setView([a.lat,a.lng],Math.max(map.getZoom(),17));anMk[a.id].openPopup();plier()};d.children[2].onclick=()=>{map.setView([a.lat,a.lng],Math.max(map.getZoom(),17));anEdit(a.id);plier()};el.appendChild(d)})}
ANN.forEach(anPose);anListe();
const anAdd=document.getElementById('anAdd');
const anCap=L.DomUtil.create('div','',map.getContainer());anCap.style.cssText='position:absolute;inset:0;z-index:650;cursor:crosshair;display:none';
L.DomEvent.disableClickPropagation(anCap);
function anFin(){anMode=false;anAdd.classList.remove('on');anCap.style.display='none';info.textContent=''}
anAdd.onclick=()=>{if(anMode){anFin();return}anMode=true;anAdd.classList.add('on');anCap.style.display='block';info.textContent='Touche la carte à l\'endroit exact du point.';plier()};
anCap.addEventListener('click',e=>{const r=map.getContainer().getBoundingClientRect();const ll=map.containerPointToLatLng([e.clientX-r.left,e.clientY-r.top]);anFin();
 const a={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),lat:ll.lat,lng:ll.lng,t:'',d:Date.now()};ANN.push(a);anSave();anPose(a);anEdit(a.id)});
document.getElementById('anExp').onclick=e=>{e.preventDefault();const b=new Blob([JSON.stringify(ANN,null,1)],{type:'application/json'});const x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='annotations.json';x.click()};
document.getElementById('anImp').onclick=e=>{e.preventDefault();document.getElementById('anFile').click()};
document.getElementById('anFile').onchange=async e=>{try{const l=JSON.parse(await e.target.files[0].text());let n=0;for(const a of l){if(a&&a.id&&typeof a.lat==='number'&&!ANN.some(x=>x.id===a.id)){ANN.push(a);anPose(a);n++}}anSave();info.textContent=n+' point(s) importé(s).'}catch(err){info.textContent='Fichier non reconnu.'}};
// ---------- Remonter le temps ----------
map.createPane('epoq').style.zIndex=220;
let EPQ=[['','Aujourd\'hui'],['ORTHOIMAGERY.ORTHOPHOTOS2011-2015','2011-15','normal','image/jpeg'],['ORTHOIMAGERY.ORTHOPHOTOS2006-2010','2006-10','normal','image/jpeg'],['ORTHOIMAGERY.ORTHOPHOTOS2000-2005','2000-05','normal','image/jpeg'],['ORTHOIMAGERY.ORTHOPHOTOS.1950-1965','1950-65','normal','image/png']];
const chips=document.getElementById('chips'),epqC=document.getElementById('epqc'),rlt=document.getElementById('rlt');let epqL=null,epqV=store.get('epq2','');
function dessineChips(){chips.innerHTML='';EPQ.forEach(e=>{const b=document.createElement('button');b.textContent=e[1];b.className=e[0]===epqV?'on':'';b.onclick=()=>choisirEpq(e[0]);chips.appendChild(b)})}
function choisirEpq(v){epqV=v;store.set('epq2',v);if(epqL){map.removeLayer(epqL);epqL=null}
 const e=EPQ.find(x=>x[0]===v);if(v&&e&&fond==='o'){epqL=L.tileLayer(g(e[0],e[2],e[3]),{maxZoom:22,maxNativeZoom:18,pane:'epoq',keepBuffer:1,opacity:+document.getElementById('fondo').value,attribution:'IGN – Remonter le temps'}).addTo(map)}
 epqC.style.display=epqL?'block':'none';if(!epqL&&typeof ridCible!=='undefined'&&ridCible==='epoq'&&ridX!==null)arretRid();dessineChips()}
function majRlt(){rlt.style.display=fond==='o'?'block':'none';choisirEpq(epqV)}
document.querySelectorAll('[name=b]').forEach(r=>r.addEventListener('change',()=>{fond=r.value;majRlt()}));
document.getElementById('fondo').addEventListener('input',e=>{epqL&&epqL.setOpacity(+e.target.value)});
(async()=>{try{const t=await fetch('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetCapabilities').then(r=>r.text());const x=new DOMParser().parseFromString(t,'text/xml');const out=[];
 for(const ly of x.getElementsByTagName('Layer')){const id=ly.getElementsByTagName('ows:Identifier')[0]?.textContent||'';const m=id.match(/^ORTHOIMAGERY\.ORTHOPHOTOS\.?(\d{4})-(\d{4})$/);if(!m||m[1]==='1965')continue;
  if(![...ly.getElementsByTagName('TileMatrixSet')].some(e=>e.textContent==='PM'))continue;
  out.push([id,m[1]+'-'+m[2].slice(2),ly.getElementsByTagName('Style')[0]?.getElementsByTagName('ows:Identifier')[0]?.textContent||'normal',ly.getElementsByTagName('Format')[0]?.textContent||'image/jpeg'])}
 if(out.length){out.sort((a,b)=>b[0].match(/\d{4}/)[0]-a[0].match(/\d{4}/)[0]);EPQ=[EPQ[0],...out];dessineChips()}}catch(e){}})();
// ---------- rideau ----------
const rid=document.getElementById('rideau'),bRid=document.getElementById('bRid');let pane=map.getPane('plans'),ridCible='plans';let ridX=null;
function clip(){if(ridX===null){pane.style.clip='';return}const nw=map.containerPointToLayerPoint([0,0]),se=map.containerPointToLayerPoint(map.getSize()),cx=map.containerPointToLayerPoint([ridX,0]).x;pane.style.clip=`rect(${nw.y}px,${cx}px,${se.y}px,${nw.x}px)`;rid.style.left=ridX+'px'}
function arretRid(){ridX=null;clip();pane.style.clip='';rid.style.display='none';bRid.classList.remove('on');document.getElementById('epqc').classList.remove('on')}
function lanceRid(cible){if(ridX!==null){const meme=ridCible===cible;arretRid();if(meme)return}ridCible=cible;pane=map.getPane(cible);ridX=map.getSize().x/2;rid.style.display='block';(cible==='epoq'?document.getElementById('epqc'):bRid).classList.add('on');
 info.textContent=cible==='epoq'?'Glisse la barre : passé à gauche, aujourd\'hui à droite.':'Plans à gauche de la barre, fond seul à droite.';plier();clip()}
bRid.onclick=()=>lanceRid('plans');epqC.onclick=()=>lanceRid('epoq');majRlt();
map.on('move zoom resize viewreset zoomend',clip);
let drag=false;const dep=e=>{if(!drag)return;const x=(e.touches?e.touches[0].clientX:e.clientX)-map.getContainer().getBoundingClientRect().left;ridX=Math.max(0,Math.min(map.getSize().x,x));clip();e.preventDefault()};
rid.addEventListener('mousedown',e=>{drag=true;e.preventDefault()});rid.addEventListener('touchstart',e=>{drag=true;e.preventDefault()},{passive:false});
document.addEventListener('mousemove',dep);document.addEventListener('touchmove',dep,{passive:false});
document.addEventListener('mouseup',()=>drag=false);document.addEventListener('touchend',()=>drag=false);
document.getElementById('bLien').onclick=()=>{info.textContent=copier(location.href)?'Lien copié ✔':location.href};
</script></body></html>
